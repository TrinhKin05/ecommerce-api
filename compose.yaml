services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db

    ports:
      - "5432:5432"

    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ecommerce-api:
    build: .
    container_name: ecommerce-api

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_pass@postgres:5432/ecommerce_db?schema=public
      JWT_SECRET: ecommerce_super_secret_key
      JWT_EXPIRES_IN: 1d

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ecommerce-postgres-data: